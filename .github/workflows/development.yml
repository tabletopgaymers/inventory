name: Development baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_check:
        description: Demonstrate rejection before requesting a deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare disposable databases
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          docker exec -i "$DB_CONTAINER" mariadb -uroot -pdisposable-ci-root <<'SQL'
          CREATE DATABASE tg_inventory_local CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE DATABASE tg_inventory_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'tg_inventory_local'@'%' IDENTIFIED BY 'disposable-ci-local';
          CREATE USER 'tg_inventory_test'@'%' IDENTIFIED BY 'disposable-ci-test';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP ON `tg\_inventory\_local`.* TO 'tg_inventory_local'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP ON `tg\_inventory\_test`.* TO 'tg_inventory_test'@'%';
          SQL
          cp .env.example .env
          cp .env.testing.example .env.testing
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=disposable-ci-local/' .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=disposable-ci-test/' .env.testing
          php artisan key:generate
          php artisan key:generate --env=testing
          php artisan baseline:prepare
          php artisan baseline:prepare --env=testing
          php artisan authentication:prepare
          php artisan authentication:prepare --env=testing
          php artisan inventory:prepare
          php artisan inventory:prepare --env=testing
          php artisan catalog:prepare
          php artisan catalog:prepare --env=testing
          php artisan daily-inventory:prepare
          php artisan daily-inventory:prepare --env=testing
          php artisan requests:prepare
          php artisan requests:prepare --env=testing
          php artisan fulfillment:prepare
          php artisan fulfillment:prepare --env=testing
          php artisan events:prepare
          php artisan events:prepare --env=testing
      - name: Automated application checks
        id: application_checks
        env:
          RELEASE_STATUS_FIXTURE: ${{ runner.temp }}/release-storage-fixture
        # Native symlinks exercise Forge's Linux storage substitution in Git.
        run: |
          bash tests/release-storage-fixture.sh "$PWD" "$RELEASE_STATUS_FIXTURE"
          composer check
      - name: Collect bounded failed Node diagnostics
        if: failure() && steps.application_checks.conclusion == 'failure'
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const reports = path.join(root, '_private/verification');
          if (!fs.existsSync(reports)) process.exit(0);
          const matches = [];
          for (const entry of fs.readdirSync(reports, {withFileTypes: true})) {
            if (!entry.isDirectory()) continue;
            const dir = path.join(reports, entry.name);
            const file = path.join(dir, 'result.json');
            if (!fs.existsSync(file) || !fs.lstatSync(file).isFile() || fs.statSync(file).size > 1024 * 1024) continue;
            const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
            const stage = receipt.stages?.[18];
            if (receipt.mode === 'full' && receipt.required_stages === 19
                && stage?.name === 'Node presentation and verification tooling'
                && ['failed', 'timeout', 'interrupted'].includes(stage.status)
                && Number.isInteger(stage.exit_code) && stage.exit_code !== 0
                && Number.isFinite(stage.seconds)) {
              matches.push({dir, receipt, stage});
            }
          }
          matches.sort((a, b) => a.dir.localeCompare(b.dir));
          const match = matches.at(-1);
          if (!match) process.exit(0);
          const log = path.join(match.dir, 'stage-19.log');
          if (!fs.existsSync(log) || !fs.lstatSync(log).isFile()) process.exit(0);
          // Node families use synthetic fixtures only; exclude all PHP/config/schema logs.
          const max = 256 * 1024;
          const buffer = Buffer.alloc(max);
          const fd = fs.openSync(log, 'r');
          const bytes = fs.readSync(fd, buffer, 0, max, 0);
          fs.closeSync(fd);
          const output = path.join(process.env.RUNNER_TEMP, 'node-failure-diagnostics');
          fs.mkdirSync(output, {recursive: true, mode: 0o700});
          const text = buffer.subarray(0, bytes).toString('utf8')
            .split(root).join('<checkout>').split(process.env.RUNNER_TEMP).join('<runner-temp>');
          fs.writeFileSync(path.join(output, 'node-stage.log'), text, {mode: 0o600});
          // Allowlisted scalar summary only: no identity/environment/candidate snapshots.
          fs.writeFileSync(path.join(output, 'summary.json'), JSON.stringify({
            stage: match.stage.name, status: match.stage.status,
            exit_code: match.stage.exit_code, seconds: match.stage.seconds,
            node: process.version, log_truncated: fs.statSync(log).size > max
          }, null, 2), {mode: 0o600});
          NODE
      - name: Retain failed Node diagnostics briefly
        if: failure() && steps.application_checks.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/node-failure-diagnostics/node-stage.log
            ${{ runner.temp }}/node-failure-diagnostics/summary.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Deliberately failing check demonstration
        if: github.event_name == 'workflow_dispatch' && inputs.fail_check
        run: exit 1
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - name: Request exact checked development candidate
        env:
          DEPLOY_HOOK: ${{ secrets.DEVELOPMENT_DEPLOY_HOOK }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          set +x
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --output /dev/null --get "$DEPLOY_HOOK" \
            --data-urlencode 'forge_deploy_branch=main' \
            --data-urlencode "forge_deploy_commit=$CHECKED_SHA" \
            --data-urlencode "checked_sha=$CHECKED_SHA"
