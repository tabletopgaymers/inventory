version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
        update-types:
          - "version-update:semver-patch"
    versioning-strategy: increase-if-necessary
    groups:
      composer-patches:
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
        update-types:
          - "version-update:semver-patch"
    versioning-strategy: increase-if-necessary
    groups:
      npm-patches:
        patterns:
          - "*"
        update-types:
          - patch
